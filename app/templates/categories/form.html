{% extends "base.html" %}
{% block title %}Category{% endblock %}
{% block content %}
<header class="page-head"><h1>{{ cat.name if cat else 'New category' }}</h1></header>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post" class="form" hx-boost="false">
  <input type="hidden" name="back" value="{{ request.query_params.get('back', '') }}">
  <div class="row">
    <label>Name <input type="text" name="name" value="{{ cat.name if cat else '' }}" required></label>
    <label>Group <input type="text" name="group_name" list="groups" value="{{ cat.group_name or '' if cat else '' }}" placeholder="Everyday"><datalist id="groups">{% for g in groups %}<option value="{{ g }}">{% endfor %}</datalist></label>
    <label>Monthly budget <input type="text" inputmode="decimal" name="default_budget" value="{{ '%.2f' % (cat.default_budget / 100) if cat else '' }}" placeholder="0.00"></label>
    <label>Colour <input type="color" name="colour" id="colour" value="{{ cat.colour if cat else '#2a78d6' }}" style="padding:2px;height:44px">
      <span style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">{% for c in ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#4a3aa7','#e34948','#9ca3af'] %}<button type="button" class="swatch" style="background:{{ c }};width:22px;height:22px;border:1px solid var(--border);cursor:pointer" onclick="document.getElementById('colour').value='{{ c }}'" aria-label="{{ c }}"></button>{% endfor %}</span>
      <small class="muted">Pick from the tested set so charts stay readable for everyone.</small>
    </label>
    <label>Rollover
      <select name="rollover_mode">{% for v, l in modes %}<option value="{{ v }}" {{ 'selected' if cat and cat.rollover_mode == v }}>{{ l }}</option>{% endfor %}</select>
    </label>
    <label>Rollover cap (optional) <input type="text" inputmode="decimal" name="rollover_cap" value="{{ '%.2f' % (cat.rollover_cap / 100) if cat and cat.rollover_cap else '' }}" placeholder="Max carried balance"></label>
    <label>Rollover starts (YYYY-MM, optional) <input type="text" name="rollover_start" value="{{ cat.rollover_start or '' if cat else '' }}" placeholder="Defaults to first month with spending"></label>
    <label>Kind
      <select name="kind"><option value="expense" {{ 'selected' if not cat or cat.kind == 'expense' }}>Expense</option><option value="income" {{ 'selected' if cat and cat.kind == 'income' }}>Income</option></select>
      <small class="muted">Income categories have no budget. They collect money in and show as a total on the month page.</small>
    </label>
    <label>Sort order <input type="number" name="sort_order" value="{{ cat.sort_order if cat else 0 }}"></label>
  </div>
  {% if cat %}<label class="check"><input type="checkbox" name="is_archived" {{ 'checked' if cat.is_archived }}> Archived (hidden from pickers, history kept)</label>{% endif %}
  <div class="actions">
    <button class="primary" type="submit">Save</button>
    <a class="button" href="/categories">Cancel</a>
  </div>
</form>
{% if cat %}
<details class="panel" style="margin-top:12px">
  <summary>Delete this category</summary>
  <form method="post" action="/categories/{{ cat.id }}/delete" class="form inline" hx-boost="false" onsubmit="return confirm('Delete {{ cat.name }}?')">
    <label>Move its transactions to
      <select name="move_to"><option value="">Uncategorised</option>{% for g in [] %}{% endfor %}</select>
    </label>
    <button class="danger" type="submit">Delete</button>
  </form>
</details>
{% endif %}
{% endblock %}
