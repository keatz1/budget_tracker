{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Budget</h1>
  <p class="muted">Sign in to the household budget.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/login" hx-boost="false">
    <label>Email <input type="email" name="email" required autocomplete="username" autofocus></label>
    <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
    <button class="primary wide" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
