{% extends "base.html" %}
{% block title %}Sub-budget{% endblock %}
{% block content %}
<header class="page-head"><h1>{{ sb.name if sb else 'New sub-budget' }}</h1></header>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post" class="form" hx-boost="false">
  <div class="row">
    <label>Name <input type="text" name="name" value="{{ sb.name if sb else '' }}" required placeholder="Istanbul trip"></label>
    <label>Category
      <select name="category_id" required>{% for c in cats %}<option value="{{ c.id }}" {{ 'selected' if sb and sb.category_id == c.id }}>{{ c.name }}</option>{% endfor %}</select>
    </label>
    <label>Total budget <input type="text" inputmode="decimal" name="total_amount" value="{{ '%.2f' % (sb.total_amount / 100) if sb else '' }}" required placeholder="4000"></label>
    <label>Starts <input type="date" name="start_date" value="{{ sb.start_date.isoformat() if sb else today }}" required></label>
    <label>Ends (optional) <input type="date" name="end_date" value="{{ sb.end_date.isoformat() if sb and sb.end_date else '' }}"></label>
  </div>
  <label>Notes <textarea name="notes">{{ sb.notes or '' if sb else '' }}</textarea></label>
  <div class="actions">
    <button class="primary" type="submit">Save</button>
    <a class="button" href="{{ '/sub-budgets/' ~ sb.id if sb else '/sub-budgets' }}">Cancel</a>
    {% if sb %}<button class="danger right" type="submit" formaction="/sub-budgets/{{ sb.id }}/delete" onclick="return confirm('Delete this sub-budget? Transactions keep their category.')">Delete</button>{% endif %}
  </div>
</form>
{% endblock %}
